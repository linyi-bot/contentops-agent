# 单机部署：`docker compose up --build` 就能出一条带引用的稿子。
#
# 不写 `version:` —— compose v2 已经不认这个字段，写了只会多一行 warning。
# 变量用 `${VAR:-默认值}` 引用：compose 会自动读同目录的 .env，
# 没有 .env 也不会报错，回落 mock（clone 下来零配置能跑，这是硬要求）。

services:
  contentops:
    build:
      context: .
      dockerfile: Dockerfile
    image: contentops-agent:0.4

    # init 让 PID 1 是个真正的 init：Ctrl+C / docker stop 能把信号传到 python，
    # 否则超时会硬等 10 秒再 SIGKILL。
    init: true

    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_THINKING: ${LLM_THINKING:-off}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.09}

    volumes:
      # 产物出容器：跑完在宿主机上直接能看到 md / 评测报告
      - ./outputs:/app/outputs
      - ./reports:/app/reports
      # checkpointer 落盘：容器重启后还能 resume 停在人工审核的会话
      - ./data:/app/.contentops

    command:
      - run
      - --topic
      - 用 AI 做周报自动化
      - --auto
      - approve
      - --out
      - /app/outputs

  # 可选：极简页面（`docker compose --profile web up --build web`）
  # 放在 profile 里，是为了不改变上面那条「up 一下就出一条稿子」的默认行为。
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: contentops-agent:0.4
    profiles: ["web"]
    init: true

    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_THINKING: ${LLM_THINKING:-off}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.09}
      # 页面和命令行共用同一份 .contentops，所以「命令行暂停、页面放行」也行
      CONTENTOPS_DB: /app/.contentops/checkpoints.sqlite

    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/.contentops

    ports:
      - "8000:8000"

    # 镜像默认健康检查走 CLI；页面这个服务改成打 /healthz，别去读知识库
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3

    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
