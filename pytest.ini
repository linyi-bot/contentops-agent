[pytest]
# 只收 tests/ 下的用例：仓库根目录还有 .venv-libs（第三方包）、docs、outputs 等，
# 让 pytest 去扫它们既慢又会误收。
testpaths = tests
# tests/_tmp 是测试自己用的工作目录（见 conftest.py 的 work fixture）。
# 本机沙箱会把用 0o700 创建的目录锁死，pytest 一递归进去就 PermissionError —— 必须排除。
norecursedirs = .git .venv .venv-libs .piptmp* .wheels .tmp tests/_tmp tools docs reports outputs
